<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🎓 Área do Aluno</span>
        </div>
    </nav>

    <main class="container pb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Alunos cadastrados</h1>
            <span class="badge bg-primary rounded-pill fs-6">{{ alunos|length }}</span>
        </div>

        {% if alunos %}
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">Nome</th>
                                <th scope="col">Curso</th>
                                <th scope="col">Bio</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for aluno in alunos %}
                                <tr>
                                    <td class="fw-semibold">{{ aluno.nome }}</td>
                                    <td><span class="badge bg-secondary">{{ aluno.curso }}</span></td>
                                    <td class="text-muted">{{ aluno.bio|default:"—" }}</td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        {% else %}
            <div class="alert alert-warning" role="alert">
                Nenhum aluno cadastrado ainda.
            </div>
        {% endif %}
    </main>

</body>
</html>
